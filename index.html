<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GeoPlot 高清地質與岩土強度分析儀</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --sub: #475569;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      line-height: 1.5;
    }
    .container { max-width: 820px; margin: 0 auto; }
    header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 16px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    header h1 { font-size: 1.2rem; margin: 0 0 4px 0; }
    header p { font-size: 0.8rem; color: #94a3b8; margin: 0; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 10px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 6px;
    }

    .upload-box {
      border: 2px dashed #94a3b8;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: 0.2s;
    }
    .upload-box:hover { border-color: #dc2626; background: #fef2f2; }
    .upload-box input {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .canvas-wrap {
      margin-top: 10px;
      text-align: center;
      background: #1e293b;
      border-radius: 8px;
      padding: 6px;
      cursor: crosshair;
    }
    canvas { max-width: 100%; height: auto; border-radius: 4px; }

    .sample-bar {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .color-chip {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid #64748b;
      display: inline-block;
      vertical-align: middle;
    }

    .layer-card {
      border: 1px solid var(--border);
      border-left: 6px solid #dc2626;
      background: #ffffff;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .layer-head {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      border-bottom: 1px dashed #cbd5e1;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    .data-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 6px;
      margin: 8px 0;
    }
    .data-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 8px;
    }
    .data-label { font-size: 0.72rem; color: var(--sub); }
    .data-val { font-size: 0.95rem; font-weight: 800; font-family: Menlo, monospace; }

    footer { text-align: center; font-size: 0.72rem; color: var(--sub); padding: 12px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>GeoPlot 高清地質與岩土強度分析儀</h1>
    <p>中心蔓延鎖定演算：完美避開空白區格線干擾</p>
  </header>

  <div class="card">
    <div class="card-title">1. 上傳剖面圖與指定掃描線</div>

    <div class="upload-box">
      <input type="file" accept="image/*" onchange="loadImage(this.files[0])">
      <div style="font-weight:700; color:#dc2626;">📷 點此上傳高清剖面圖</div>
      <div style="font-size:0.75rem; color:#64748b;">上傳後，點擊彩色地層柱的中心，程式將以該點向上下蔓延解析</div>
    </div>

    <div class="canvas-wrap" id="canvasWrap" style="display:none;">
      <canvas id="mainCanvas" onclick="pickAndAnalyze(event)"></canvas>
    </div>

    <div class="sample-bar" id="sampleBar" style="display:none;">
      <div style="display:flex; align-items:center; gap:8px;">
        <div id="chipColor" class="color-chip"></div>
        <div><span style="font-size:0.75rem; color:#64748b;">點擊深度：</span><b id="txtDepth">-- m</b></div>
      </div>
      <div><span style="font-size:0.75rem; color:#64748b;">實測波速：</span><b id="txtVs" style="color:#dc2626; font-size:1.1rem;">-- m/s</b></div>
      <div><span style="font-size:0.75rem; color:#64748b;">剪力模數 Gmax：</span><b id="txtGmax">-- MPa</b></div>
    </div>
  </div>

  <div class="card" id="outCard" style="display:none;">
    <div class="card-title">2. 全深度動態切層與地層材質報告</div>
    <div id="layersContainer"></div>
  </div>

  <footer>
    色彩引擎：HSV 連續插值法 (支援 40 m/s ~ 660 m/s 全範圍)
  </footer>
</div>

<script>
let img = new Image();
let offCanvas = document.createElement('canvas');

function getContinuousVs(r, g, b) {
  // 排除背景白與深色黑線
  if ((r > 240 && g > 240 && b > 240) || (r < 40 && g < 40 && b < 40)) return null;

  let r_n = r / 255, g_n = g / 255, b_n = b / 255;
  let max = Math.max(r_n, g_n, b_n), min = Math.min(r_n, g_n, b_n);
  let h = 0;
  let s = max === 0 ? 0 : (max - min) / max;
  let l = (max + min) / 2;
  
  if (s < 0.15 || l < 0.1 || l > 0.95) return null;

  if (max !== min) {
    let d = max - min;
    if (max === r_n) h = (g_n - b_n) / d + (g_n < b_n ? 6 : 0);
    else if (max === g_n) h = (b_n - r_n) / d + 2;
    else h = (r_n - g_n) / d + 4;
    h *= 60; 
  }

  let vs = 0;
  if (h >= 300 || h < 5) {
    let offset = (h >= 300) ? (360 - h) : -h; 
    vs = 40 + ((60 - offset) / 60) * 20; 
  } else if (h >= 5 && h < 20) {
    vs = 60 + ((h - 5) / 15) * 20; 
  } else if (h >= 20 && h < 40) {
    vs = 80 + ((h - 20) / 20) * 25; 
  } else if (h >= 40 && h < 70) {
    vs = 105 + ((h - 40) / 30) * 35; 
  } else if (h >= 70 && h < 140) {
    vs = 140 + ((h - 70) / 70) * 60; 
  } else {
    vs = 200 + ((h - 140) / 100) * 200;
  }

  vs = Math.max(40, Math.min(660, vs));
  return vs;
}

function getColorColor(vs) {
  if (vs < 50) return "#e100e1"; 
  if (vs < 75) return "#eb0000"; 
  if (vs < 90) return "#f55000"; 
  if (vs < 115) return "#fa8200"; 
  if (vs < 130) return "#ffb400"; 
  if (vs < 160) return "#ffe100"; 
  if (vs < 220) return "#a3e635"; 
  if (vs < 300) return "#22c55e"; 
  if (vs < 450) return "#3b82f6"; 
  return "#8b5cf6"; 
}

function loadImage(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    img.onload = function() {
      const c = document.getElementById('mainCanvas');
      c.width = img.width;
      c.height = img.height;
      c.getContext('2d').drawImage(img, 0, 0);

      offCanvas.width = img.width;
      offCanvas.height = img.height;
      offCanvas.getContext('2d').drawImage(img, 0, 0);

      document.getElementById('canvasWrap').style.display = "block";
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function pickAndAnalyze(e) {
  const cvs = document.getElementById('mainCanvas');
  const rect = cvs.getBoundingClientRect();
  const scaleX = cvs.width / rect.width;
  const scaleY = cvs.height / rect.height;

  const clickX = Math.floor((e.clientX - rect.left) * scaleX);
  const clickY = Math.floor((e.clientY - rect.top) * scaleY);
  const ctx = offCanvas.getContext('2d');
  const h = offCanvas.height;

  // 核心修改：以點擊位置為中心，向上下「蔓延」尋找邊界，杜絕碰觸上方無效藍線
  let startY = clickY;
  let nullCount = 0;
  for (let y = clickY; y >= 0; y--) {
    let p = ctx.getImageData(clickX, y, 1, 1).data;
    if (getContinuousVs(p[0], p[1], p[2]) === null) {
      nullCount++;
      if (nullCount > 5) break; // 連續 5 個空白像素即判定到達地表
    } else {
      startY = y; 
      nullCount = 0;
    }
  }

  let endY = clickY;
  nullCount = 0;
  for (let y = clickY; y < h; y++) {
    let p = ctx.getImageData(clickX, y, 1, 1).data;
    if (getContinuousVs(p[0], p[1], p[2]) === null) {
      nullCount++;
      if (nullCount > 5) break; // 連續 5 個空白像素即判定到達底部
    } else {
      endY = y;
      nullCount = 0;
    }
  }

  if (endY - startY < 30) {
    alert("掃描失敗：請確認點擊在彩色地層柱內部！");
    return;
  }

  const curY = Math.max(startY, Math.min(endY, clickY));
  const depth = ((curY - startY) / (endY - startY)) * 1.5;
  const p = ctx.getImageData(clickX, curY, 1, 1).data;
  const vs = getContinuousVs(p[0], p[1], p[2]) || 60;
  const colorTag = getColorColor(vs);
  
  document.getElementById('sampleBar').style.display = "flex";
  document.getElementById('sampleBar').style.borderColor = colorTag;
  document.getElementById('chipColor').style.backgroundColor = `rgb(${p[0]},${p[1]},${p[2]})`;
  document.getElementById('txtDepth').innerText = `${depth.toFixed(2)} m`;
  document.getElementById('txtVs').innerText = `${Math.round(vs)} m/s`;
  document.getElementById('txtVs').style.color = colorTag;
  
  const rho = 1.45;
  document.getElementById('txtGmax').innerText = `${((rho * 1000 * vs * vs)/1e6).toFixed(1)} MPa`;

  executeContinuousScan(clickX, startY, endY);
}

function executeContinuousScan(scanX, topY, botY) {
  const ctx = offCanvas.getContext('2d');
  
  const steps = 200;
  const samples = [];
  for (let i = 0; i <= steps; i++) {
    const y = topY + Math.floor((i / steps) * (botY - topY));
    const p = ctx.getImageData(scanX, y, 1, 1).data;
    let vs = getContinuousVs(p[0], p[1], p[2]);
    if (vs === null) vs = (samples.length > 0) ? samples[samples.length-1].vs : 60;
    samples.push({ z: (i / steps) * 1.5, vs: vs, y: y });
  }

  const smoothed = [];
  for (let i = 0; i < samples.length; i++) {
    let sum = 0, count = 0;
    for (let j = Math.max(0, i-3); j <= Math.min(samples.length-1, i+3); j++) {
      sum += samples[j].vs; count++;
    }
    smoothed.push({ z: samples[i].z, vs: sum/count, y: samples[i].y });
  }

  const boundaries = [0];
  let currentLayerBaseVs = smoothed[0].vs;
  
  for (let i = 1; i < smoothed.length; i++) {
    const drift = Math.abs(smoothed[i].vs - currentLayerBaseVs);
    if (drift > 12) {
      if (smoothed[i].z - smoothed[boundaries[boundaries.length - 1]].z >= 0.04) {
        boundaries.push(i);
        currentLayerBaseVs = smoothed[i].vs; 
      }
    }
  }
  boundaries.push(smoothed.length - 1);

  const dispCtx = document.getElementById('mainCanvas').getContext('2d');
  dispCtx.drawImage(offCanvas, 0, 0);
  
  dispCtx.strokeStyle = "rgba(255, 255, 255, 0.9)";
  dispCtx.lineWidth = 2;
  dispCtx.setLineDash([4, 4]);
  dispCtx.beginPath();
  dispCtx.moveTo(scanX, topY);
  dispCtx.lineTo(scanX, botY);
  dispCtx.stroke();
  dispCtx.setLineDash([]);

  let layers = [];
  for (let b = 0; b < boundaries.length - 1; b++) {
    const s = boundaries[b], e = boundaries[b + 1];
    const topZ = smoothed[s].z, botZ = smoothed[e].z;
    
    let sumVs = 0;
    for (let k = s; k <= e; k++) sumVs += smoothed[k].vs;
    const avgVs = Math.round(sumVs / (e - s + 1));

    if (b > 0) {
      const splitY = smoothed[s].y;
      dispCtx.strokeStyle = "#ffff00";
      dispCtx.lineWidth = 3;
      dispCtx.beginPath();
      dispCtx.moveTo(scanX - 35, splitY);
      dispCtx.lineTo(scanX + 35, splitY);
      dispCtx.stroke();
      dispCtx.fillStyle = "#ffff00";
      dispCtx.font = "bold 15px sans-serif";
      dispCtx.fillText(`分界 ${topZ.toFixed(2)}m`, scanX + 45, splitY + 5);
    }
    layers.push({ id: b + 1, top: topZ, bot: botZ, h: botZ - topZ, vs: avgVs });
  }

  const container = document.getElementById('layersContainer');
  container.innerHTML = "";
  layers.forEach(lyr => {
    let rho = 1.6;
    if (lyr.vs < 80) rho = 1.45;
    else if (lyr.vs >= 180 && lyr.vs < 300) rho = 1.9; 
    else if (lyr.vs >= 300) rho = 2.2; 

    const gmax = (rho * 1000.0 * (lyr.vs ** 2)) / 1e6;
    const colorTag = getColorColor(lyr.vs);
    
    let mat = "", diag = "", qa = "";

    if (lyr.vs <= 50) {
      mat = "極軟泥漿 / 流泥";
      diag = "高含水量的爛泥，幾乎像液體一樣沒有任何支撐力。"; 
      qa = "< 20 kPa (極低)";
    } else if (lyr.vs <= 80) {
      mat = "軟弱黏土 / 淤泥";
      diag = "一般的軟泥土，稍微受壓就容易產生凹陷或沉陷。"; 
      qa = "30 ~ 50 kPa";
    } else if (lyr.vs <= 120) {
      mat = "鬆散砂土 / 粉細砂";
      diag = "鬆散的沙子或一般表土，還沒有被壓實。"; 
      qa = "50 ~ 80 kPa";
    } else if (lyr.vs <= 180) {
      mat = "中等緊密砂土 / 硬質黏土";
      diag = "被壓實過的沙土或偏硬的黏土，承載表現算穩固。"; 
      qa = "90 ~ 150 kPa";
    } else if (lyr.vs <= 260) {
      mat = "碎石 / 道碴 / 密實礫石";
      diag = "主要由石頭組成的粗粒料層，顆粒互相卡得很緊（互鎖力強）。"; 
      qa = "200 ~ 300 kPa";
    } else if (lyr.vs <= 350) {
      mat = "卵礫石 / 極緻密砂石";
      diag = "大顆石頭與沙子緊密混合，非常堅硬，承載力極佳。"; 
      qa = "300 ~ 500 kPa";
    } else if (lyr.vs <= 500) {
      mat = "風化軟岩 (如泥岩、頁岩)";
      diag = "已經變成石頭的岩盤，但稍微偏軟或有明顯風化痕跡。"; 
      qa = "500 ~ 800 kPa";
    } else {
      mat = "堅硬岩盤 (如砂岩、石灰岩)";
      diag = "非常堅硬的純石頭/基岩層，剛性極高。"; 
      qa = "> 1000 kPa (極高)";
    }

    container.innerHTML += `
      <div class="layer-card" style="border-left-color:${colorTag};">
        <div class="layer-head">
          <span style="color:${colorTag};">第 ${lyr.id} 層：${mat}</span>
          <span style="color:#0284c7;">深度: ${lyr.top.toFixed(2)} ~ ${lyr.bot.toFixed(2)} m (厚: ${lyr.h.toFixed(2)}m)</span>
        </div>
        <div class="data-grid">
          <div class="data-box"><div class="data-label">平均波速 (Vs)</div><div class="data-val" style="color:${colorTag};">${lyr.vs} m/s</div></div>
          <div class="data-box"><div class="data-label">剪力模數 (Gmax)</div><div class="data-val">${gmax.toFixed(1)} MPa</div></div>
          <div class="data-box"><div class="data-label">容許承載力評估</div><div class="data-val">${qa}</div></div>
        </div>
        <div style="font-size:0.85rem; color:#475569; margin-top:4px;"><b>土質與岩體狀態：</b>${diag}</div>
      </div>
    `;
  });

  document.getElementById('outCard').style.display = "block";
  document.getElementById('outCard').scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
