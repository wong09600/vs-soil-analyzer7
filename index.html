<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GeoPlot 絕對精準對照與分層解析儀</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --sub: #475569;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      line-height: 1.5;
    }
    .container { max-width: 820px; margin: 0 auto; }
    header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 16px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    header h1 { font-size: 1.2rem; margin: 0 0 4px 0; }
    header p { font-size: 0.8rem; color: #94a3b8; margin: 0; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 10px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .upload-box {
      border: 2px dashed #f87171;
      background: #fef2f2;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }
    .upload-box input {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .depth-setting {
      margin-top: 10px;
      background: #f1f5f9;
      padding: 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .depth-setting input {
      width: 80px;
      padding: 4px 8px;
      border: 1px solid #94a3b8;
      border-radius: 4px;
      font-weight: bold;
      text-align: center;
    }

    .canvas-wrap {
      margin-top: 10px;
      text-align: center;
      background: #1e293b;
      border-radius: 8px;
      padding: 6px;
      cursor: crosshair;
    }
    canvas { max-width: 100%; height: auto; border-radius: 4px; }

    .sample-bar {
      background: #f8fafc;
      border: 2px solid #ef4444;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .color-chip {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid #64748b;
      display: inline-block;
      vertical-align: middle;
    }

    .layer-card {
      border: 1px solid var(--border);
      border-left: 6px solid #dc2626;
      background: #ffffff;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .layer-head {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      border-bottom: 1px dashed #cbd5e1;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    .data-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 6px;
      margin: 8px 0;
    }
    .data-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 8px;
    }
    .data-label { font-size: 0.72rem; color: var(--sub); }
    .data-val { font-size: 0.95rem; font-weight: 800; font-family: Menlo, monospace; }

    footer { text-align: center; font-size: 0.72rem; color: var(--sub); padding: 12px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>GeoPlot 手動鎖定分析儀</h1>
    <p>手動指定取樣基準線・徹底杜絕掃描色標尺之誤判</p>
  </header>

  <div class="card">
    <div class="card-title">
      <span>1. 上傳圖檔與取樣</span>
      <span style="font-size:0.75rem; color:#dc2626;">點擊真正的地層剖面柱！</span>
    </div>

    <div class="upload-box">
      <input type="file" accept="image/*" onchange="loadImage(this.files[0])">
      <div style="font-weight:700; color:#dc2626;">📷 點此上傳圖片</div>
      <div style="font-size:0.75rem; color:#64748b;">上傳後，請直接在圖片上「真正的地層數據柱」點擊一下</div>
    </div>

    <div class="depth-setting" id="depthConfig" style="display:none;">
      <label style="font-size:0.85rem; font-weight:700; color:#334155;">設定剖面總深度 (m)：</label>
      <input type="number" id="maxDepth" value="1.5" step="0.1">
    </div>

    <div class="canvas-wrap" id="canvasWrap" style="display:none;">
      <canvas id="mainCanvas" onclick="pickAndAnalyze(event)"></canvas>
    </div>

    <!-- 點擊即時診斷 -->
    <div class="sample-bar" id="sampleBar" style="display:none;">
      <div style="display:flex; align-items:center; gap:8px;">
        <div id="chipColor" class="color-chip"></div>
        <div><span style="font-size:0.75rem; color:#64748b;">鎖定深度：</span><b id="txtDepth">-- m</b></div>
      </div>
      <div><span style="font-size:0.75rem; color:#64748b;">實測波速：</span><b id="txtVs" style="color:#dc2626; font-size:1.1rem;">-- m/s</b></div>
      <div><span style="font-size:0.75rem; color:#64748b;">剪力模數 Gmax：</span><b id="txtGmax">-- MPa</b></div>
    </div>
  </div>

  <div class="card" id="outCard" style="display:none;">
    <div class="card-title">
      <span>2. 鎖定剖面之真實分層報告</span>
      <span style="font-size:0.75rem; color:#dc2626;">僅掃描指定垂直線</span>
    </div>
    <div id="layersContainer"></div>
  </div>

  <footer>
    色標嚴格定義：40(洋紅)・60(正紅)・80(橙紅)・100(橘色)・120(橙黃)・140(黃)<br>
    © Geotechnical Manual Targeted Analysis System
  </footer>
</div>

<script>
let img = new Image();
let offCanvas = document.createElement('canvas');

// 官方色階 (嚴格 RGB 限定)
const palette = [
  { vs: 40,  r: 225, g: 0,   b: 225, name: "洋紅色 / 粉紫", color: "#e100e1" },
  { vs: 60,  r: 235, g: 0,   b: 0,   name: "鮮紅色", color: "#eb0000" },
  { vs: 80,  r: 245, g: 80,  b: 0,   name: "橙紅色", color: "#f55000" },
  { vs: 100, r: 250, g: 130, b: 0,   name: "橘色", color: "#fa8200" },
  { vs: 120, r: 255, g: 180, b: 0,   name: "橙黃色", color: "#ffb400" },
  { vs: 140, r: 255, g: 225, b: 0,   name: "黃色", color: "#ffe100" }
];

function loadImage(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    img.onload = function() {
      const c = document.getElementById('mainCanvas');
      c.width = img.width;
      c.height = img.height;
      c.getContext('2d').drawImage(img, 0, 0);

      offCanvas.width = img.width;
      offCanvas.height = img.height;
      offCanvas.getContext('2d').drawImage(img, 0, 0);

      document.getElementById('depthConfig').style.display = "flex";
      document.getElementById('canvasWrap').style.display = "block";
      
      // 提示使用者點擊
      alert("圖片已載入！\n請直接點擊圖片中「真正的地層剖面柱」，程式將鎖定該座標進行掃描。千萬不要點到旁邊的色標尺喔！");
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function getPixelVs(r, g, b) {
  // 排除背景白與線條黑
  if ((r > 240 && g > 240 && b > 240) || (r < 40 && g < 40 && b < 40)) return null;

  let minD = Infinity, bestMatch = null;
  for (let item of palette) {
    let d = Math.sqrt(Math.pow(r - item.r, 2) + Math.pow(g - item.g, 2) + Math.pow(b - item.b, 2));
    if (d < 110 && d < minD) {
      minD = d;
      bestMatch = item;
    }
  }
  return bestMatch;
}

// 點擊即分析
function pickAndAnalyze(e) {
  const cvs = document.getElementById('mainCanvas');
  const rect = cvs.getBoundingClientRect();
  const scaleX = cvs.width / rect.width;
  const scaleY = cvs.height / rect.height;

  const clickX = Math.floor((e.clientX - rect.left) * scaleX);
  let clickY = Math.floor((e.clientY - rect.top) * scaleY);

  const ctx = offCanvas.getContext('2d');
  const h = offCanvas.height;

  // 1. 以使用者點擊的 X 座標，自動尋找該柱體的頂部與底部 Y 座標
  let startY = 0, endY = h - 1;
  for (let y = 0; y < h; y += 2) {
    let p = ctx.getImageData(clickX, y, 1, 1).data;
    if (getPixelVs(p[0], p[1], p[2]) !== null) { startY = y; break; }
  }
  for (let y = h - 1; y >= startY; y -= 2) {
    let p = ctx.getImageData(clickX, y, 1, 1).data;
    if (getPixelVs(p[0], p[1], p[2]) !== null) { endY = y; break; }
  }

  if (endY - startY < 30) {
    alert("在你點擊的垂直線上找不到連續的地層顏色！請確認你點的是「地層剖面柱」。");
    return;
  }

  // 限定點擊的 Y 不能超出柱體範圍
  clickY = Math.max(startY, Math.min(endY, clickY));

  // 計算深度
  const maxDepth = parseFloat(document.getElementById('maxDepth').value) || 1.5;
  const depth = ((clickY - startY) / (endY - startY)) * maxDepth;

  // 更新點擊位置的即時資料
  const p = ctx.getImageData(clickX, clickY, 1, 1).data;
  const match = getPixelVs(p[0], p[1], p[2]);

  if (match) {
    const rho = 1.45;
    const gmax = (rho * 1000.0 * (match.vs ** 2)) / 1e6;

    document.getElementById('sampleBar').style.display = "flex";
    document.getElementById('chipColor').style.backgroundColor = `rgb(${p[0]},${p[1]},${p[2]})`;
    document.getElementById('txtDepth').innerText = `${depth.toFixed(2)} m`;
    document.getElementById('txtVs').innerText = `${match.vs} m/s (${match.name})`;
    document.getElementById('txtGmax').innerText = `${gmax.toFixed(1)} MPa`;

    // 2. 執行全柱體掃描並輸出報告
    executeScan(clickX, startY, endY, maxDepth);
  }
}

function executeScan(scanX, topY, botY, maxDepth) {
  const ctx = offCanvas.getContext('2d');
  
  // 在畫布上畫出白虛線，表示目前鎖定掃描的位置
  const dispCtx = document.getElementById('mainCanvas').getContext('2d');
  dispCtx.drawImage(offCanvas, 0, 0);
  dispCtx.strokeStyle = "rgba(255, 255, 255, 0.9)";
  dispCtx.lineWidth = 2;
  dispCtx.setLineDash([4, 4]);
  dispCtx.beginPath();
  dispCtx.moveTo(scanX, topY);
  dispCtx.lineTo(scanX, botY);
  dispCtx.stroke();
  dispCtx.setLineDash([]);

  // 每隔 1% 取樣一次
  const samples = [];
  const steps = 150;
  for (let i = 0; i <= steps; i++) {
    const y = topY + Math.floor((i / steps) * (botY - topY));
    const p = ctx.getImageData(scanX, y, 1, 1).data;
    const match = getPixelVs(p[0], p[1], p[2]) || { vs: 60, name: "紅色" };
    samples.push({ z: (i / steps) * maxDepth, vs: match.vs, name: match.name, y: y });
  }

  // 偵測顏色變化點 (即分界面)
  const boundaries = [0];
  for (let i = 1; i < samples.length; i++) {
    if (samples[i].vs !== samples[i - 1].vs) {
      if (samples[i].z - samples[boundaries[boundaries.length - 1]].z >= 0.05) {
        boundaries.push(i);
      }
    }
  }
  boundaries.push(samples.length - 1);

  let layers = [];
  for (let b = 0; b < boundaries.length - 1; b++) {
    const s = boundaries[b], e = boundaries[b + 1];
    const zTop = samples[s].z, zBot = samples[e].z;

    let sumVs = 0;
    for (let k = s; k <= e; k++) sumVs += samples[k].vs;
    const avgVs = Math.round(sumVs / (e - s + 1));

    if (b > 0) {
      const splitY = samples[s].y;
      dispCtx.strokeStyle = "#ffff00";
      dispCtx.lineWidth = 3;
      dispCtx.beginPath();
      dispCtx.moveTo(scanX - 30, splitY);
      dispCtx.lineTo(scanX + 30, splitY);
      dispCtx.stroke();
      dispCtx.fillStyle = "#ffff00";
      dispCtx.font = "bold 15px sans-serif";
      dispCtx.fillText(`分界 ${zTop.toFixed(2)}m`, scanX + 35, splitY + 5);
    }
    layers.push({ id: b + 1, top: zTop, bot: zBot, h: zBot - zTop, vs: avgVs });
  }

  // 輸出報告
  const container = document.getElementById('layersContainer');
  container.innerHTML = "";
  layers.forEach(lyr => {
    const rho = 1.45;
    const gmax = (rho * 1000.0 * (lyr.vs ** 2)) / 1e6;
    const su = 25.0 * Math.pow(lyr.vs / 100.0, 2.2);

    let mat = "", colorTag = "#dc2626", qa = "";
    if (lyr.vs <= 50) {
      mat = "洋紅/粉紫極低速層 —— 極軟弱流泥夾層 (Vs ≈ 40 m/s)";
      colorTag = "#e100e1";
      qa = "< 20 kPa (極低)";
    } else if (lyr.vs <= 70) {
      mat = "鮮紅色主土層 —— 飽和軟弱泥漿/淤泥層 (Vs ≈ 60 m/s)";
      colorTag = "#eb0000";
      qa = "30 kPa";
    } else if (lyr.vs <= 90) {
      mat = "橙紅色過渡層 —— 鬆散泥砂/未密實軟土 (Vs ≈ 80 m/s)";
      colorTag = "#f55000";
      qa = "40 ~ 50 kPa";
    } else {
      mat = "橘色表層 —— 鬆散表層填料/未咬合粗料 (Vs ≈ 100 m/s)";
      colorTag = "#fa8200";
      qa = "50 ~ 80 kPa";
    }

    container.innerHTML += `
      <div class="layer-card" style="border-left-color:${colorTag};">
        <div class="layer-head">
          <span style="color:${colorTag};">第 ${lyr.id} 層：${mat}</span>
          <span style="color:#0284c7;">深度: ${lyr.top.toFixed(2)} ~ ${lyr.bot.toFixed(2)} m (厚: ${lyr.h.toFixed(2)}m)</span>
        </div>
        <div class="data-grid">
          <div class="data-box"><div class="data-label">色標波速 (Vs)</div><div class="data-val" style="color:${colorTag};">${lyr.vs} m/s</div></div>
          <div class="data-box"><div class="data-label">剪力模數 (Gmax)</div><div class="data-val">${gmax.toFixed(1)} MPa</div></div>
          <div class="data-box"><div class="data-label">不排水剪力強度 (Su)</div><div class="data-val">${su.toFixed(1)} kPa</div></div>
          <div class="data-box"><div class="data-label">承載力評估</div><div class="data-val">${qa}</div></div>
        </div>
      </div>
    `;
  });

  document.getElementById('outCard').style.display = "block";
  document.getElementById('outCard').scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
