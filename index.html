<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GeoPlot 高解析地層漸變分析儀</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --sub: #475569;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      line-height: 1.5;
    }
    .container { max-width: 820px; margin: 0 auto; }
    header {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 16px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    header h1 { font-size: 1.2rem; margin: 0 0 4px 0; }
    header p { font-size: 0.8rem; color: #94a3b8; margin: 0; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 10px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 6px;
    }

    .upload-box {
      border: 2px dashed #94a3b8;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: 0.2s;
    }
    .upload-box:hover { border-color: #dc2626; background: #fef2f2; }
    .upload-box input {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .canvas-wrap {
      margin-top: 10px;
      text-align: center;
      background: #1e293b;
      border-radius: 8px;
      padding: 6px;
      cursor: crosshair;
    }
    canvas { max-width: 100%; height: auto; border-radius: 4px; }

    .sample-bar {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .color-chip {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid #64748b;
      display: inline-block;
      vertical-align: middle;
    }

    .layer-card {
      border: 1px solid var(--border);
      border-left: 6px solid #dc2626;
      background: #ffffff;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .layer-head {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      border-bottom: 1px dashed #cbd5e1;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    .data-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 6px;
      margin: 8px 0;
    }
    .data-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 8px;
    }
    .data-label { font-size: 0.72rem; color: var(--sub); }
    .data-val { font-size: 0.95rem; font-weight: 800; font-family: Menlo, monospace; }

    footer { text-align: center; font-size: 0.72rem; color: var(--sub); padding: 12px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>GeoPlot 高清漸變分析儀</h1>
    <p>支援連續色彩插值・動態捕捉平滑漸變與夾層邊界</p>
  </header>

  <div class="card">
    <div class="card-title">1. 上傳高清原圖與指定掃描線</div>

    <div class="upload-box">
      <input type="file" accept="image/*" onchange="loadImage(this.files[0])">
      <div style="font-weight:700; color:#dc2626;">📷 點此上傳高清剖面圖</div>
      <div style="font-size:0.75rem; color:#64748b;">上傳後，點擊地層長條柱的中心位置，程式將沿該直線進行深層解析</div>
    </div>

    <div class="canvas-wrap" id="canvasWrap" style="display:none;">
      <canvas id="mainCanvas" onclick="pickAndAnalyze(event)"></canvas>
    </div>

    <!-- 點擊即時診斷 -->
    <div class="sample-bar" id="sampleBar" style="display:none;">
      <div style="display:flex; align-items:center; gap:8px;">
        <div id="chipColor" class="color-chip"></div>
        <div><span style="font-size:0.75rem; color:#64748b;">點擊深度：</span><b id="txtDepth">-- m</b></div>
      </div>
      <div><span style="font-size:0.75rem; color:#64748b;">實測波速：</span><b id="txtVs" style="color:#dc2626; font-size:1.1rem;">-- m/s</b></div>
      <div><span style="font-size:0.75rem; color:#64748b;">剪力模數 Gmax：</span><b id="txtGmax">-- MPa</b></div>
    </div>
  </div>

  <div class="card" id="outCard" style="display:none;">
    <div class="card-title">2. 全深度動態切層與物理參數報告</div>
    <div id="layersContainer"></div>
  </div>

  <footer>
    色彩引擎：HSV 色相連續插值法 (Continuous Hue Interpolation)<br>
    切層引擎：累積波速漂移演算法 (Cumulative Drift Threshold)
  </footer>
</div>

<script>
let img = new Image();
let offCanvas = document.createElement('canvas');

// 建立高密度的連續色相查詢表 (Hue to Vs)
function getContinuousVs(r, g, b) {
  // 排除背景白與黑框
  if ((r > 240 && g > 240 && b > 240) || (r < 40 && g < 40 && b < 40)) return null;

  let r_n = r / 255, g_n = g / 255, b_n = b / 255;
  let max = Math.max(r_n, g_n, b_n), min = Math.min(r_n, g_n, b_n);
  let h = 0;
  let s = max === 0 ? 0 : (max - min) / max;
  let l = (max + min) / 2;
  
  if (s < 0.2 || l < 0.1 || l > 0.95) return null; // 排除灰階

  if (max !== min) {
    let d = max - min;
    if (max === r_n) h = (g_n - b_n) / d + (g_n < b_n ? 6 : 0);
    else if (max === g_n) h = (b_n - r_n) / d + 2;
    else h = (r_n - g_n) / d + 4;
    h *= 60; // Hue (0 ~ 360)
  }

  // 根據 SeisImager 色標尺建立連續映射函數
  // 洋紅 (300°~360°) -> 40 m/s
  // 紅 (0°) -> 60 m/s
  // 橙紅 (20°) -> 80 m/s
  // 橘 (35°) -> 100 m/s
  // 黃 (60°) -> 140 m/s
  let vs = 0;
  if (h >= 300 || h < 5) {
    // 洋紅到紅
    let offset = (h >= 300) ? (360 - h) : -h; // 將 300~360 映射到負數
    vs = 40 + ((60 - offset) / 60) * 20; // 40~60 區間
  } else if (h >= 5 && h < 20) {
    vs = 60 + ((h - 5) / 15) * 20; // 60~80
  } else if (h >= 20 && h < 40) {
    vs = 80 + ((h - 20) / 20) * 25; // 80~105
  } else if (h >= 40 && h < 70) {
    vs = 105 + ((h - 40) / 30) * 35; // 105~140
  } else if (h >= 70 && h < 140) {
    vs = 140 + ((h - 70) / 70) * 60; // 140~200
  } else {
    // 綠色以上
    vs = 200 + ((h - 140) / 100) * 200;
  }

  // 限制極值
  vs = Math.max(40, Math.min(660, vs));
  return vs;
}

// 根據波速取得對應顏色標籤供 UI 顯示
function getColorLabel(vs) {
  if (vs < 50) return { name: "洋紅色/粉紫", color: "#e100e1" };
  if (vs < 75) return { name: "鮮紅色", color: "#eb0000" };
  if (vs < 90) return { name: "橙紅色", color: "#f55000" };
  if (vs < 115) return { name: "橘色", color: "#fa8200" };
  if (vs < 130) return { name: "橙黃色", color: "#ffb400" };
  return { name: "黃色+", color: "#ffe100" };
}

function loadImage(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    img.onload = function() {
      const c = document.getElementById('mainCanvas');
      c.width = img.width;
      c.height = img.height;
      c.getContext('2d').drawImage(img, 0, 0);

      offCanvas.width = img.width;
      offCanvas.height = img.height;
      offCanvas.getContext('2d').drawImage(img, 0, 0);

      document.getElementById('canvasWrap').style.display = "block";
      alert("圖片解析完成。\n\n請在圖片左側的「地層彩色柱」中央點擊一下，程式將沿著該直線進行全深度連續採樣。");
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function pickAndAnalyze(e) {
  const cvs = document.getElementById('mainCanvas');
  const rect = cvs.getBoundingClientRect();
  const scaleX = cvs.width / rect.width;
  const scaleY = cvs.height / rect.height;

  const clickX = Math.floor((e.clientX - rect.left) * scaleX);
  const clickY = Math.floor((e.clientY - rect.top) * scaleY);
  const ctx = offCanvas.getContext('2d');
  const h = offCanvas.height;

  // 1. 自動尋找柱狀體的真實頂端(0.0m)與底端(1.5m)
  let startY = 0, endY = h - 1;
  for (let y = 0; y < h; y++) {
    let p = ctx.getImageData(clickX, y, 1, 1).data;
    if (getContinuousVs(p[0], p[1], p[2]) !== null) { startY = y; break; }
  }
  for (let y = h - 1; y >= startY; y--) {
    let p = ctx.getImageData(clickX, y, 1, 1).data;
    if (getContinuousVs(p[0], p[1], p[2]) !== null) { endY = y; break; }
  }

  if (endY - startY < 50) {
    alert("掃描失敗：無法在該垂直線上找到連續的地層色彩。請確認點擊在彩色地層柱內部！");
    return;
  }

  // 即時點擊顯示
  const curY = Math.max(startY, Math.min(endY, clickY));
  const depth = ((curY - startY) / (endY - startY)) * 1.5;
  const p = ctx.getImageData(clickX, curY, 1, 1).data;
  const vs = getContinuousVs(p[0], p[1], p[2]) || 60;
  const label = getColorLabel(vs);
  
  document.getElementById('sampleBar').style.display = "flex";
  document.getElementById('sampleBar').style.borderColor = label.color;
  document.getElementById('chipColor').style.backgroundColor = `rgb(${p[0]},${p[1]},${p[2]})`;
  document.getElementById('txtDepth').innerText = `${depth.toFixed(2)} m`;
  document.getElementById('txtVs').innerText = `${Math.round(vs)} m/s (${label.name})`;
  document.getElementById('txtVs').style.color = label.color;
  
  const rho = 1.45;
  document.getElementById('txtGmax').innerText = `${((rho * 1000 * vs * vs)/1e6).toFixed(1)} MPa`;

  // 2. 執行「全深度高解析漸變掃描」
  executeContinuousScan(clickX, startY, endY);
}

function executeContinuousScan(scanX, topY, botY) {
  const ctx = offCanvas.getContext('2d');
  
  // 以 200 個採樣點高解析度往下掃
  const steps = 200;
  const samples = [];
  for (let i = 0; i <= steps; i++) {
    const y = topY + Math.floor((i / steps) * (botY - topY));
    const p = ctx.getImageData(scanX, y, 1, 1).data;
    let vs = getContinuousVs(p[0], p[1], p[2]);
    if (vs === null) vs = (samples.length > 0) ? samples[samples.length-1].vs : 60; // 容錯
    samples.push({ z: (i / steps) * 1.5, vs: vs, y: y });
  }

  // 平滑濾波 (移動平均)
  const smoothed = [];
  for (let i = 0; i < samples.length; i++) {
    let sum = 0, count = 0;
    for (let j = Math.max(0, i-3); j <= Math.min(samples.length-1, i+3); j++) {
      sum += samples[j].vs; count++;
    }
    smoothed.push({ z: samples[i].z, vs: sum/count, y: samples[i].y });
  }

  // 累積漂移切層演算法 (Cumulative Drift)
  const boundaries = [0];
  let currentLayerBaseVs = smoothed[0].vs;
  
  for (let i = 1; i < smoothed.length; i++) {
    const drift = Math.abs(smoothed[i].vs - currentLayerBaseVs);
    // 當波速偏離當前層基準超過 12 m/s，且距離上次切層大於 0.04m 時，切出新層
    if (drift > 12) {
      if (smoothed[i].z - smoothed[boundaries[boundaries.length - 1]].z >= 0.04) {
        boundaries.push(i);
        currentLayerBaseVs = smoothed[i].vs; // 更新新層的基準
      }
    }
  }
  boundaries.push(smoothed.length - 1);

  // 畫出掃描線與分界面
  const dispCtx = document.getElementById('mainCanvas').getContext('2d');
  dispCtx.drawImage(offCanvas, 0, 0);
  
  dispCtx.strokeStyle = "rgba(255, 255, 255, 0.9)";
  dispCtx.lineWidth = 2;
  dispCtx.setLineDash([4, 4]);
  dispCtx.beginPath();
  dispCtx.moveTo(scanX, topY);
  dispCtx.lineTo(scanX, botY);
  dispCtx.stroke();
  dispCtx.setLineDash([]);

  let layers = [];
  for (let b = 0; b < boundaries.length - 1; b++) {
    const s = boundaries[b], e = boundaries[b + 1];
    const topZ = smoothed[s].z, botZ = smoothed[e].z;
    
    let sumVs = 0;
    for (let k = s; k <= e; k++) sumVs += smoothed[k].vs;
    const avgVs = Math.round(sumVs / (e - s + 1));

    if (b > 0) {
      const splitY = smoothed[s].y;
      dispCtx.strokeStyle = "#ffff00";
      dispCtx.lineWidth = 3;
      dispCtx.beginPath();
      dispCtx.moveTo(scanX - 35, splitY);
      dispCtx.lineTo(scanX + 35, splitY);
      dispCtx.stroke();
      dispCtx.fillStyle = "#ffff00";
      dispCtx.font = "bold 15px sans-serif";
      dispCtx.fillText(`分界 ${topZ.toFixed(2)}m`, scanX + 45, splitY + 5);
    }
    layers.push({ id: b + 1, top: topZ, bot: botZ, h: botZ - topZ, vs: avgVs });
  }

  // 渲染報告
  const container = document.getElementById('layersContainer');
  container.innerHTML = "";
  layers.forEach(lyr => {
    const rho = 1.45;
    const gmax = (rho * 1000.0 * (lyr.vs ** 2)) / 1e6;
    const su = 25.0 * Math.pow(lyr.vs / 100.0, 2.2);
    
    const label = getColorLabel(lyr.vs);
    let diag = "", qa = "";

    if (lyr.vs <= 55) {
      diag = "極軟夾層，飽和懸浮泥漿態，無骨架支撐力。"; qa = "< 20 kPa";
    } else if (lyr.vs <= 75) {
      diag = "軟弱沉積帶，抗壓密剛度低，呈現塑性擠出。"; qa = "30 ~ 40 kPa";
    } else if (lyr.vs <= 95) {
      diag = "過渡漸變層 / 鬆散介質，開始產生微弱抗剪力鏈。"; qa = "40 ~ 60 kPa";
    } else {
      diag = "中等緊密固結層 / 表土層，具備初步自立骨架咬合。"; qa = "60 ~ 100 kPa";
    }

    container.innerHTML += `
      <div class="layer-card" style="border-left-color:${label.color};">
        <div class="layer-head">
          <span style="color:${label.color};">第 ${lyr.id} 層：${label.name}</span>
          <span style="color:#0284c7;">深度: ${lyr.top.toFixed(2)} ~ ${lyr.bot.toFixed(2)} m (厚: ${lyr.h.toFixed(2)}m)</span>
        </div>
        <div class="data-grid">
          <div class="data-box"><div class="data-label">平均波速 (Vs)</div><div class="data-val" style="color:${label.color};">${lyr.vs} m/s</div></div>
          <div class="data-box"><div class="data-label">剪力模數 (Gmax)</div><div class="data-val">${gmax.toFixed(1)} MPa</div></div>
          <div class="data-box"><div class="data-label">不排水強度 (Su)</div><div class="data-val">${su.toFixed(1)} kPa</div></div>
          <div class="data-box"><div class="data-label">容許承載力估算</div><div class="data-val">${qa}</div></div>
        </div>
        <div style="font-size:0.85rem; color:#475569; margin-top:4px;"><b>地層動力學診斷：</b>${diag}</div>
      </div>
    `;
  });

  document.getElementById('outCard').style.display = "block";
  document.getElementById('outCard').scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
